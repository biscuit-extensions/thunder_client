[extension]
id = "thunder_client"
name = "Thunder Client"
version = "0.2.0"
description = "Lightweight REST API client, HTTP request builder, and response body inspector"
author = "tomlin7"
icon = "icon.png"

[dependencies]
python = ["requests>=2.31.0", "urllib3"]
tools = []

[contributes]
commands = [
    { id = "thunder_client.new_request", title = "Thunder Client: New Request" },
    { id = "thunder_client.send_request", title = "Thunder Client: Send Request" },
    { id = "thunder_client.save_request", title = "Thunder Client: Save to Collection" },
    { id = "thunder_client.view_history", title = "Thunder Client: View Request History" },
    { id = "thunder_client.clear_history", title = "Thunder Client: Clear History" }
]
views = [
    { id = "thunder_client.collections", title = "Thunder Client Collections" },
    { id = "thunder_client.response", title = "HTTP Response" }
]
